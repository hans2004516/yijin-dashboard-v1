main:
  params: [args]
  steps:
    - initialize:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
    - deidentify:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/member-deidentify"}
          body: {}
          connector_params:
            timeout: 1800
        result: deidentification_execution
    - analyze:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/member-analysis"}
          body: {}
          connector_params:
            timeout: 1800
        result: analysis_execution
    - finish:
        return:
          status: SUCCEEDED
          deidentification_execution: ${deidentification_execution.name}
          analysis_execution: ${analysis_execution.name}
